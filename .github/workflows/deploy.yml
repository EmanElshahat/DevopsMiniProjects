name: Build & Push Docker Image & Deploy

on:
  push:
    branches:
      - main
env:
  IMAGE_NAME: emanabosamra/login-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Build project
      run: mvn clean package
      working-directory: P3/Java-Login-App

    - name: Build Docker image
      run: docker build -t $IMAGE_NAME:$IMAGE_TAG .
      working-directory: P3/Java-Login-App

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Push Docker image
      run: docker push $IMAGE_NAME:$IMAGE_TAG
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        envs: IMAGE_NAME,IMAGE_TAG
        script: |
          docker pull $IMAGE_NAME:$IMAGE_TAG
          docker stop -f login-app || true
          docker rm -f login-app || true
          docker run -d -p 8081:8080 --name login-app $IMAGE_NAME:$IMAGE_TAG

